<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Deepak Saini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #0f2a4d;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 1.8rem;
            color: #ef4444;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .error-message {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #0f2a4d;
            color: #ffffff;
            border: 2px solid #0f2a4d;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: #0f2a4d;
        }

        .btn-secondary {
            background-color: transparent;
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .btn-secondary:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        /* Animation for a slight floating effect */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating-icon {
            animation: float 4s ease-in-out infinite;
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="floating-icon">🚀</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Page Not Found</h2>
        <p class="error-message">
            The page you are looking for might have been moved, deleted, or perhaps it never existed. Let's get you back on track.
        </p>
        
        <div class="btn-group">
            <!-- Redirects to your GitHub Pages main portfolio -->
            <a href="/" class="btn btn-primary">Go to Homepage</a>
            
            <!-- Redirects to your Job portal blog -->
            <a href="https://IndGovtJobs-com.blogspot.com" target="_blank" class="btn btn-secondary">Check Latest Govt Jobs</a>
        </div>
    </div>

</body>
</html>
