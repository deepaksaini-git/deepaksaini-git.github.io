<style>
    .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: transparent; z-index: 9999; }
    .progress-bar { height: 4px; background: #00c6ff; width: 0%; box-shadow: 0 0 10px #00c6ff; }
</style>
<div class="progress-container"><div class="progress-bar" id="myBar"></div></div>
    {% include header.html %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
  "author": {
    "@type": "Person",
    "name": "Deepak Saini",
    "url": "https://deepaksaini-git.github.io"
  },
  "description": "{{ content | strip_html | truncatewords: 30 | escape }}"
}
</script>
    
    <div class="glass-panel" style="max-width: 800px; margin: 20px auto; padding: 20px;">
        <h1>{{ page.title }}</h1>
        
        <!-- Yahan aapke post ka actual content ayega -->
        <div class="content">
            {{ content }}
        </div>
    </div>

    <!-- Ye automatically _includes/footer.html ko yahan merge kar dega -->
    {% include footer.html %}
